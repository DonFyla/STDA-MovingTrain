{% extends "base.html" %}

{% block title %}Verification Link Invalid - Moving Train Chess Academy{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-5rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-lg p-8 border border-brand-100 text-center">
            <div class="w-14 h-14 bg-red-50 rounded-full flex items-center justify-center text-red-500 mx-auto mb-5">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-brand-900 mb-2">Link expired or invalid</h1>
            <p class="text-brand-600 mb-6">
                This verification link is no longer valid. It may have expired or already been used.
            </p>
            <a href="{% url 'accounts:resend_verification' %}" class="inline-block px-6 py-3 bg-brand-600 text-white font-semibold rounded-full hover:bg-brand-700 transition-colors">
                Resend verification link
            </a>
        </div>
    </div>
</section>
{% endblock %}
