{% extends "base.html" %}

{% block title %}Password Changed - Moving Train Chess Academy{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-5rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-lg p-8 border border-brand-100 text-center">
            <div class="w-14 h-14 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-600 mx-auto mb-5">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-brand-900 mb-2">Password changed</h1>
            <p class="text-brand-600 mb-6">Your password has been updated successfully.</p>
            <a href="{% url 'accounts:profile_edit' %}" class="inline-block px-6 py-3 bg-brand-600 text-white font-semibold rounded-full hover:bg-brand-700 transition-colors">
                Back to profile
            </a>
        </div>
    </div>
</section>
{% endblock %}
